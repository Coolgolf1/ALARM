[project]
name = "final-project-nlp-dl-gru"
version = "0.1.0"
description = "Multimodal NLP and deep learning pipeline for news risk detection that combines image captioning, named entity recognition, sentiment analysis, and a fine-tuned LLM to produce structured alert decisions. Includes research notebooks and reusable Python modules for training, benchmarking, and end-to-end inference."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0,<2.0",
    "bitsandbytes>=0.45,<0.50",
    "datasets>=3.0,<5.0",
    "gdown>=5.2,<6.0",
    "gensim>=4.3,<5.0",
    "google-genai>=1.0,<2.0",
    "huggingface-hub>=0.26,<1.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.8,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "peft>=0.13,<0.18",
    "pillow>=10.4,<12.0",
    "pingouin>=0.5.5,<0.6",
    "pydantic>=2.8,<3.0",
    "scikit-learn>=1.5,<2.0",
    "tensorboard>=2.18,<3.0",
    "torch>=2.5,<2.7",
    "tqdm>=4.66,<5.0",
    "transformers>=4.47,<5.0",
]
